name: Release plugin
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin tag (key@X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  PLUGIN_TAG: ${{ inputs.tag }}

jobs:
  build:
    if: github.repository == 'JieWaZi/neux-plugins' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify plugin tag and main ancestry
        id: tag
        run: |
          node scripts/publish-plugin.mjs check-tag "$PLUGIN_TAG" >> "$GITHUB_OUTPUT"
      - name: Build the tagged plugin
        env:
          SOURCE_COMMIT: ${{ steps.tag.outputs.source_commit }}
          PLUGIN_KEY: ${{ steps.tag.outputs.key }}
        run: |
          output="$RUNNER_TEMP/plugin-release"
          node scripts/build-catalog.mjs "$SOURCE_COMMIT" "$PLUGIN_TAG" "$output"
          cd "$output"
          tar -cf "$RUNNER_TEMP/plugin-release.tar" -- catalog.json \
            "$PLUGIN_KEY.zip" "$PLUGIN_KEY.details.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release
          path: ${{ runner.temp }}/plugin-release.tar
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: plugin-release-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-release
          path: ${{ runner.temp }}
      - name: Publish fixed plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          output="$RUNNER_TEMP/plugin-release"
          mkdir -p "$output"
          tar -xf "$RUNNER_TEMP/plugin-release.tar" -C "$output"
          node scripts/publish-plugin.mjs publish "$PLUGIN_TAG" "$SOURCE_COMMIT" "$output"

  promote-catalog:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: plugin-catalog-promotion
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Merge and promote the plugin catalog
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: node scripts/publish-plugin.mjs promote "$PLUGIN_TAG" "$SOURCE_COMMIT"
